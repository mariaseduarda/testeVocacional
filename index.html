<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Vocacional</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- TELA INICIAL -->
        <section id="inicio" class="tela">
            <img src="UEPA.png" alt="UEPA">

            <h1>Teste Vocacional Engenharia de Software</h1>

            <p>
                Descubra qual área da tecnologia combina mais com você!
            </p>

            <button onclick="iniciarTeste()">
                Começar teste
            </button>
        </section>


        <!-- TELA DAS PERGUNTAS -->
        <section id="quiz" class="tela escondido">

            <div class="progresso">
                <span id="numeroPergunta"></span>
            </div>

            <h2 id="pergunta"></h2>

            <div id="alternativas"></div>

        </section>


        <!-- TELA DO RESULTADO -->
        <section id="resultado" class="tela escondido">

            <h2 id="areaResultado"></h2>

            <p id="descricaoResultado"></p>

            <button onclick="reiniciarTeste()">
                Fazer novamente
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
